# .github/workflows/ci.yml
# Runs "composer verify" on every pull request to main and every push to main.
# The job name "verify" is the check the ruleset and Render wait for. Do not rename it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer verify
      - name: Build and smoke-test the Docker image
        run: |
          docker build --tag laravel-ci .
          app_key=$(php artisan key:generate --show)
          docker run --detach --name laravel-ci --publish 127.0.0.1:10000:10000 \
            --env "APP_KEY=$app_key" --env SESSION_DRIVER=array laravel-ci
          trap 'docker logs laravel-ci; docker rm -f laravel-ci' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:10000/up
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:10000/
